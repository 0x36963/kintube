# Local development services. Start with `make dev-up`.
name: kintube-dev

services:
  postgres:
    # Multi-arch build by a docker-postgis maintainer; the official postgis/postgis image is amd64-only.
    image: imresamu/postgis:18-3.6.1-trixie
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP: the temporary server Postgres runs during first-boot init only listens on the
      # Unix socket, so a socket check would report "ready" before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI: http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # S3-compatible object storage (stands in for Cloudflare R2). MinIO's community images were
  # discontinued in 2025; RustFS is Apache-2.0 and MinIO-compatible. Console: http://localhost:9001
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: kintube
      RUSTFS_SECRET_KEY: kintube-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Console
    volumes:
      - s3data:/data

volumes:
  pgdata:
  s3data:
