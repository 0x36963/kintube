[package]
name = "app-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
aws-sdk-s3 = { version = "1.157.0", features = ["behavior-version-latest"] }
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "smtp-transport", "builder", "ring", "rustls-native-certs"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["full"] }
