[package]
name = "app-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "smtp-transport", "builder", "ring", "rustls-native-certs"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[lints]
workspace = true
