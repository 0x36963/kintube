[package]
name = "worker"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
app-core = { version = "0.1.0", path = "../app-core" }
dotenvy = "0.15.7"
futures = "0.3.34"
media = { version = "0.1.0", path = "../media" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.29.0"

[lints]
workspace = true
